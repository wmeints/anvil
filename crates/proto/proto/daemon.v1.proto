syntax = "proto3";

package firebrick;

service SandboxManagementService {
  rpc StartSandbox(StartSandboxRequest) returns (stream StartSandboxResponse);
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc RemoveSandbox(RemoveSandboxRequest) returns (RemoveSandboxResponse);
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);
  rpc SshTunnel(stream SshTunnelRequest) returns (stream SshTunnelResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc RemoveSecret(RemoveSecretRequest) returns (RemoveSecretResponse);
  // Replaces the egress rules of an existing sandbox. The sandbox keeps its disk but not its
  // processes: it is recreated from a disk snapshot and ends in the state it was in. A sandbox
  // that already has the rules is left alone.
  rpc UpdateNetwork(UpdateNetworkRequest) returns (UpdateNetworkResponse);
}

message StartSandboxRequest {
  string name = 1;
  string image = 2;
  optional SandboxResources resources = 3;
  // Absolute host path, mounted read/write at /workspaces/<leaf-name>.
  string workspace = 4;
  // Whether the image's /sbin/init runs as PID 1. Unset means true.
  optional bool init = 5;
  // Unset means the default volume sizes.
  optional SandboxVolumes volumes = 6;
  // Whether fbkd trusts and installs the workspace's mise tools on start. Unset means true.
  optional bool mise = 7;
  // Egress rules, applied when the sandbox is created. Unset means microsandbox's default policy.
  optional NetworkPolicy network = 8;
  // Host ports to forward to the sandbox's loopback. Stored with the sandbox, and applied to a
  // running sandbox too. Unset keeps the stored list; an empty list means no forwards.
  optional PortForwards ports = 9;
  // Extra host directories to bind mount, besides the workspace. Applied when the sandbox is
  // created.
  repeated Mount mounts = 10;
}

message PortForwards {
  // No host port appears twice.
  repeated PortForward ports = 1;
}

message PortForward {
  // Port fbkd listens on at the host's loopback, from 1 to 65535.
  uint32 host = 1;
  // Port on the sandbox's 127.0.0.1 that connections reach, from 1 to 65535.
  uint32 guest = 2;
}

message PortForwardFailure {
  PortForward port = 1;
  // Why fbkd couldn't listen on the host port, e.g. because another process uses it.
  string reason = 2;
}

message Mount {
  // Canonical absolute host path of a directory.
  string host = 1;
  // Absolute guest path.
  string guest = 2;
  bool readonly = 3;
}

message NetworkPolicy {
  // Whether outgoing traffic is denied unless an allow rule matches. When false, the rules are
  // validated but not applied.
  bool enforce = 1;
  // Each rule is a host name, *.domain, an IP address or a CIDR range.
  repeated string allow = 2;
  // Deny rules win over allow rules.
  repeated string deny = 3;
}

message SandboxResources {
  uint32 cpu = 1;
  string memory = 2;
}

message SandboxVolumes {
  // Size of the disk mounted at /var/lib/docker. Empty means the default of 20 GiB.
  string docker = 1;
}

// A stream of image pull progress, ending with the started sandbox. Errors end the stream with
// a status instead.
message StartSandboxResponse {
  reserved 1, 2;
  reserved "forwards", "failed_forwards";

  oneof message {
    // Sent while fbkd downloads the image of a sandbox it creates. Never sent when the image is
    // cached or the sandbox already exists. Best-effort: fbkd may skip messages.
    ImagePullProgress pull_progress = 3;
    // The last message of the stream, sent once the sandbox runs.
    SandboxStarted started = 4;
  }
}

message ImagePullProgress {
  // Reference of the image being pulled, e.g. `ghcr.io/wmeints/firebrick-base:0.3.0`.
  string image = 1;
  // Bytes downloaded so far, over all layers.
  uint64 downloaded_bytes = 2;
  // Compressed size of all layers. Unset when the manifest has no layer sizes.
  optional uint64 total_bytes = 3;
  // Set on the last message of the pull, once the image is downloaded.
  bool complete = 4;
}

message SandboxStarted {
  // The forwards that are open for the sandbox, sorted by host port.
  repeated PortForward forwards = 1;
  // The forwards fbkd couldn't open. The sandbox still started.
  repeated PortForwardFailure failed_forwards = 2;
}

message StopSandboxRequest {
  string name = 1;
}

message StopSandboxResponse {}

message ListSandboxesRequest {}

message ListSandboxesResponse {
  repeated SandboxSummary sandboxes = 1;
}

message GetSandboxRequest {
  string name = 1;
}

message GetSandboxResponse {
  string name = 1;
  SandboxStatus status = 2;
  // SSH host name of the sandbox, e.g. `project.fbk`. Empty when it has none.
  string hostname = 3;
  // Guest path the workspace is mounted at, e.g. `/workspaces/project`. Empty when it has none.
  string workspace_path = 4;
  // Host directory mounted as the workspace, e.g. `/home/user/project`. Empty when it has none.
  string workspace_host_path = 5;
}

message SandboxSummary {
  string name = 1;
  SandboxStatus status = 2;
  // SSH host name of the sandbox, e.g. `project.fbk`. Empty when it has none.
  string hostname = 3;
}

enum SandboxStatus {
  SANDBOX_STATUS_STOPPED = 0;
  SANDBOX_STATUS_RUNNING = 1;
  SANDBOX_STATUS_PAUSED = 2;
  SANDBOX_STATUS_STARTING = 3;
  SANDBOX_STATUS_STOPPING = 4;
  SANDBOX_STATUS_CRASHED = 5;
}

message RemoveSandboxRequest {
  string name = 1;
  // Stops the sandbox first when it's running. Without it, removing a running
  // sandbox fails with FAILED_PRECONDITION.
  bool force = 2;
}

message RemoveSandboxResponse {}

message AttachRequest {
  oneof message {
    // Must be the first message on the stream, and only the first.
    AttachStart start = 1;
    AttachInput input = 2;
    AttachResize resize = 3;
  }
}

message AttachStart {
  string name = 1;
  string command = 2;
  repeated string args = 3;
  AttachResize size = 4;
}

message AttachInput {
  bytes data = 1;
}

message AttachResize {
  uint32 width = 1;
  uint32 height = 2;
}

message AttachResponse {
  oneof message {
    bytes output = 1;
    int32 exit_code = 2;
  }
}

message SshTunnelRequest {
  oneof message {
    // Must be the first message on the stream, and only the first.
    string hostname = 1;
    bytes data = 2;
  }
}

message SshTunnelResponse {
  bytes data = 1;
}

message SetSecretRequest {
  // Environment variable that exposes the secret's placeholder in sandboxes.
  string name = 1;
  string value = 2;
  // Hosts that may receive the real value. Empty uses the defaults for well-known names.
  repeated string allowed_hosts = 3;
}

message SetSecretResponse {
  // Existing sandboxes the secret couldn't be added to.
  repeated string failed_sandboxes = 1;
}

message ListSecretsRequest {}

message ListSecretsResponse {
  // Sorted by name. Values are never returned.
  repeated SecretSummary secrets = 1;
}

message SecretSummary {
  string name = 1;
  repeated string allowed_hosts = 2;
}

message RemoveSecretRequest {
  string name = 1;
}

message RemoveSecretResponse {
  // Existing sandboxes the secret couldn't be removed from. When there are any, the secret
  // stays stored, so removing it again retries them.
  repeated string failed_sandboxes = 1;
}

message UpdateNetworkRequest {
  string name = 1;
  // The complete new network section. Unset means microsandbox's default policy.
  NetworkPolicy network = 2;
}

message UpdateNetworkResponse {
  // Whether the sandbox was recreated. False when it already had the rules.
  bool updated = 1;
}
