# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  DIST_DIR: '{{.ROOT_DIR}}/dist'

tasks:
  build:
    desc: Compile the CLI and the daemon into dist/bin
    deps: [build:anvil, build:anvild]
  build:anvil:
    desc: Compile the CLI
    cmds:
      - go build -o {{.DIST_DIR}}/bin/anvil ./cmd/anvil/
  build:anvild:
    desc: Compile the daemon
    cmds:
      - go build -o {{.DIST_DIR}}/bin/anvild ./cmd/anvild/
  lint:
    desc: Run golangci-lint against all source files
    cmds:
      - golangci-lint run --build-tags integration ./...
  format:
    desc: Run golangci-lint to format all source files
    cmds:
      - golangci-lint fmt ./...
  test:
    desc: Run the unit-tests for all packages
    cmds:
      - go test -race ./...
  test:integration:
    desc: Run the integration tests (requires containerd)
    cmds:
      - go test -race -tags integration ./...
