[tools]
actionlint = "1.7.12"
buf = "latest"
claude = "latest"
dprint = "0.61.1"
gh = "latest"
lefthook = "latest"
protoc = "latest"
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-src,rust-analyzer" }

[hooks]
# Install the git hooks from lefthook.yml after `mise install`.
postinstall = "lefthook install"
