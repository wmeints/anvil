name: Image

# Build the anvil-base image when the Dockerfile changes. The release workflow
# only builds it for a tag, so this catches a broken Dockerfile before merging.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yaml]
  pull_request:
    branches: [main]
    paths: [Dockerfile, .github/workflows/image.yaml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build anvil-base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The same platforms as the release, without pushing the image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
