name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: Check formatting
        run: golangci-lint fmt --diff ./...
      - name: Lint
        run: task lint
      - name: Unit tests
        run: task test
      - name: Build
        run: task build
