name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Build on the oldest supported Ubuntu so the binaries need glibc 2.35 at most.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # microsandbox only supports Apple Silicon on macOS.
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Windows is left out: anvil and anvild depend on unix sockets and signals.
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04's apt protoc (3.12) rejects proto3 optional fields, so install a current release.
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Installs the Rust toolchain pinned in mise.toml.
      - uses: jdx/mise-action@v2

      # The binaries default to the anvil-base image tagged with their version, so the tag must match it.
      - name: Check tag matches version
        shell: bash
        run: |
          pkgid=$(cargo pkgid -p anvil-spec)
          version=${pkgid##*[#@]}
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version v$version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --bin anvil --bin anvild

      # The CLI starts anvild from its own directory, so both binaries ship side by side.
      - name: Package
        env:
          NAME: anvil-${{ github.ref_name }}-${{ matrix.target }}
        run: |
          mkdir "$NAME"
          cp target/release/anvil target/release/anvild "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: anvil-${{ matrix.target }}
          path: anvil-${{ github.ref_name }}-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  image:
    name: Publish anvil-base image
    # Publish the image only once every package has built, so a failed build pushes nothing.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build for both architectures so the image runs in sandboxes on x86_64 Linux and Apple Silicon.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/anvil-base:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: Create GitHub release
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the packages: the image job's build record (*.dockerbuild) can't be downloaded here.
      - uses: actions/download-artifact@v4
        with:
          pattern: anvil-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Tags such as v0.2.0-rc.1 publish a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
