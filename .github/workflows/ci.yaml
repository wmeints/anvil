name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs, but build every commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the Rust toolchain, protoc and the other tools pinned in mise.toml.
      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check markdown formatting
        run: dprint check

      - name: Lint workflows
        run: actionlint

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

  integration:
    name: Integration tests (microVMs)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # microsandbox boots VMs through KVM; give the runner user access to it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: jdx/mise-action@v2

      - uses: Swatinem/rust-cache@v2
        with:
          key: vm-tests

      # The microsandbox build script installs the msb runtime into MSB_HOME (/tmp/firebrick-msb, see .cargo/config.toml).
      - name: Integration tests
        run: cargo test -p firebrick-daemon --features vm-tests
