# Refer to https://lefthook.dev/configuration/ for configuration options.

commit-msg:
  jobs:
    - name: conventional commit
      run: |
        header=$(head -n1 {1})
        pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+$'

        # Allow messages generated by git itself (merges, reverts, autosquash).
        if echo "$header" | grep -qE '^(Merge |Revert "|fixup! |squash! |amend! )'; then
          exit 0
        fi

        if ! echo "$header" | grep -qE "$pattern"; then
          echo "Invalid commit message: \"$header\""
          echo ""
          echo "Commit messages must follow the Conventional Commits format:"
          echo "  <type>[optional scope][!]: <description>"
          echo ""
          echo "Allowed types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test"
          echo "Example: feat(cli): add support for config files"
          exit 1
        fi
