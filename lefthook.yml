# Git hooks for Anvil. `mise install` runs `lefthook install` to activate them.

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.rs"
      run: cargo fmt --all --check
    markdown:
      glob: "*.md"
      run: dprint check
    clippy:
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    unit-tests:
      run: cargo test --workspace

commit-msg:
  commands:
    conventional-commit:
      # Enforces https://www.conventionalcommits.org: `type(scope)!: description`.
      run: |
        pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .+'
        header=$(head -n1 "{1}")
        if ! printf '%s' "$header" | grep -Eq "$pattern" && ! printf '%s' "$header" | grep -Eq '^(Merge|Revert|fixup!|squash!) '; then
          echo "Commit message does not follow Conventional Commits:"
          echo "  $header"
          echo "Expected: <type>(<scope>)?!?: <description>"
          echo "Types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test"
          exit 1
        fi

